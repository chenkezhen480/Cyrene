# SearXNG Settings for Cyrene Agent
# SearXNG 配置文件（Cyrene Agent 搜索后端）

use_default_settings: true

general:
  instance_name: "Cyrene Search"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  port: 8888
  bind_address: "0.0.0.0"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true
  default_theme: simple
  results_on_new_tab: false

# Outgoing requests
outgoing:
  request_timeout: 10
  max_request_timeout: 15
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20

# The Java web_search tool passes its configured engine list on every request.
# SEARXNG_SECRET is read directly by SearXNG and is supplied by Compose.
engines:
  - name: bing
    weight: 2.0
