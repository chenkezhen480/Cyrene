# Cyrene Agent - Docker Compose 一键部署
# 启动: cd docker && docker compose up -d
# 构建镜像: docker compose build
# 查看日志: docker compose logs -f cyrene

name: cyrene

services:
  # ============================================================
  # Cyrene Agent - 主应用
  # ============================================================
  cyrene-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cyrene-agent
    ports:
      - "${HARNESS_SERVER_PORT:-8080}:8080"
    volumes:
      # 挂载 .env 配置文件
      - ../.env:/app/.env:ro
      # 知识库上传目录
      - knowledge-uploads:/app/knowledge-uploads
      # 产物存储
      - artifacts:/app/artifacts
      - ./neo4j/schemas:/app/graph-schemas
      # Docker socket（沙盒容器需要）
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # 覆盖容器内部的服务地址（使用 Docker 网络内的服务名）
      - HARNESS_RAG_URL=http://milvus:19530
      - HARNESS_AUDIT_DB_URL=jdbc:mysql://mysql:3306/agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - HARNESS_AUDIT_DB_USER=root
      - HARNESS_AUDIT_DB_PASS=${HARNESS_AUDIT_DB_PASS:-cyrene123}
      - HARNESS_MEMORY_REDIS_URL=redis://redis:6379
      - HARNESS_GRAPH_NEO4J_URI=bolt://neo4j:7687
      - HARNESS_GRAPH_SCHEMA_DIR=/app/graph-schemas
      - HARNESS_TOOL_WEB_SEARCH_SEARXNG_URL=http://searxng:8080
      - HARNESS_TOOL_BROWSER_WORKER_URL=http://browser-worker:8081
      - HARNESS_DOCUMENT_PARSER_URL=http://document-parser:8082
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      browser-worker:
        condition: service_healthy
      document-parser:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cyrene-net
      - document-parser-net

  # ============================================================
  # Browser Worker - isolated Python + Playwright page control
  # ============================================================
  browser-worker:
    build:
      context: ./browser-worker
      dockerfile: Dockerfile
    container_name: cyrene-browser-worker
    env_file:
      - ../.env
    user: pwuser
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m
    shm_size: "1gb"
    mem_limit: 1g
    cpus: 1.0
    environment:
      - BROWSER_HEADLESS=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - cyrene-net

  # ============================================================
  # Document Parser - MarkItDown + image OCR/description
  # ============================================================
  document-parser:
    build:
      context: ./document-parser
      dockerfile: Dockerfile
    container_name: cyrene-document-parser
    env_file:
      - ../.env
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1g
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - HARNESS_DOCUMENT_PARSER_HOST=0.0.0.0
      - HARNESS_DOCUMENT_PARSER_PORT=8082
    restart: unless-stopped
    networks:
      - document-parser-net

  # ============================================================
  # MySQL 8.0 - 会话/消息/记忆/审计存储
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: cyrene-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${HARNESS_AUDIT_DB_PASS:-cyrene123}
      MYSQL_DATABASE: agent
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 自动执行建表脚本（仅首次启动生效）
      - ../sql/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../sql/schema-users-mysql.sql:/docker-entrypoint-initdb.d/02-users.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${HARNESS_AUDIT_DB_PASS:-cyrene123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - cyrene-net

  # ============================================================
  # etcd - Milvus 元数据存储
  # ============================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: cyrene-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - cyrene-net

  # ============================================================
  # MinIO - Milvus 对象存储
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: cyrene-minio
    ports:
      - "9001:9001"     # Console
      - "9000:9000"     # S3 API
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./milvus/minio:/minio_data
      # /data is the minio image's default VOLUME; we serve /minio_data instead,
      # so bind /data to a host dir to avoid a stray anonymous volume.
      - ./milvus/minio-data:/data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - cyrene-net

  # ============================================================
  # Milvus Standalone - 向量数据库
  # ============================================================
  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: cyrene-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    ports:
      - "19530:19530"   # gRPC
      - "9091:9091"     # Metrics
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./milvus/standalone:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cyrene-net

  # ============================================================
  # Redis 7 - 会话缓存（分布式）
  # ============================================================
  # ============================================================
  # Neo4j Community - optional structured knowledge graph
  # Start with: docker compose --profile graph up -d
  # ============================================================
  neo4j:
    image: neo4j:5.26.28
    container_name: cyrene-neo4j
    profiles:
      - graph
    ports:
      - "127.0.0.1:${HARNESS_GRAPH_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${HARNESS_GRAPH_NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      # Empty password makes Neo4j fail explicitly only when the graph profile is started.
      NEO4J_AUTH: neo4j/${HARNESS_GRAPH_NEO4J_PASSWORD:-}
      HARNESS_GRAPH_NEO4J_PASSWORD: ${HARNESS_GRAPH_NEO4J_PASSWORD:-}
      NEO4J_server_memory_heap_initial__size: ${HARNESS_GRAPH_NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${HARNESS_GRAPH_NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${HARNESS_GRAPH_NEO4J_PAGECACHE:-512m}
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j -p "$${HARNESS_GRAPH_NEO4J_PASSWORD}"
          "RETURN 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - cyrene-net

  redis:
    image: redis:7-alpine
    container_name: cyrene-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cyrene-net

  # ============================================================
  # SearXNG - 元搜索引擎（联网搜索后端）
  # ============================================================
  searxng:
    image: searxng/searxng:latest
    container_name: cyrene-searxng
    ports:
      - "8888:8088"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - cyrene-net

volumes:
  mysql-data:
  redis-data:
  knowledge-uploads:
  artifacts:

networks:
  cyrene-net:
    driver: bridge
  document-parser-net:
    driver: bridge
